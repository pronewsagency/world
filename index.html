    <!-- مكتبة الأيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* المتغيرات والهوية البصرية */
        :root {
            --c-cyan: #00FFD1;
            --c-blue: #0077FF;
            --c-purple: #7B2CBF;
            --gradient-main: linear-gradient(135deg, var(--c-cyan), var(--c-blue), var(--c-purple));
            --bg-base: #030409; 
            --glass-bg: rgba(20, 22, 35, 0.5);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #8b92a5;
        }

        /* الإعدادات الأساسية */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-main); line-height: 1.7; overflow-x: hidden; }
        
        /* شريط التمرير المخصص */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--c-blue); border-radius: 4px; }

        /* القائمة العلوية */
        header {
            background: rgba(3, 4, 9, 0.8);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 15px 5%; display: flex; justify-content: center;
            align-items: center; position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid var(--glass-border);
        }
        .logo { font-size: 30px; font-weight: 900; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .logo span { background: var(--gradient-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* الحاوية الرئيسية */
        .main-container {
            max-width: 1100px; margin: 0 auto; padding: 30px 20px;
            display: flex; flex-direction: column; gap: 25px;
        }

        /* تأثير الظهور للأقسام */
        .view-section { display: none; animation: fadeIn 0.4s ease forwards; }
        #view-player.active { display: flex; flex-direction: column; gap: 15px; }
        #view-channels.active, #view-news-list.active, #view-article.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 1. قسم المشغل */
        .player-section { width: 100%; display: flex; flex-direction: column; gap: 15px; }
        .channel-title { font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .live-dot { width: 12px; height: 12px; background: #ff2a2a; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 42, 42, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(255, 42, 42, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 42, 42, 0); } }

        .video-wrapper {
            width: 100%; aspect-ratio: 16 / 9; border-radius: 20px; overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); border: 1px solid var(--glass-border);
            background: #000; position: relative; transition: opacity 0.3s ease;
        }
        
        #player { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        [data-player] { border-radius: 20px; overflow: hidden; }

        /* إعلانات */
        .ad-banner-container {
            width: 100%; text-align: center; background: rgba(255, 255, 255, 0.02);
            border-radius: 15px; border: 1px dashed var(--glass-border); padding: 10px;
            min-height: 70px; display: flex; justify-content: center; align-items: center; overflow: hidden;
        }

        /* 2. قسم الأزرار (مكانها تحت المشغل) */
        .action-buttons { display: flex; gap: 15px; align-items: center; justify-content: space-between; }
        .btn-action { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 12px 20px; border-radius: 12px; font-weight: 800; font-size: 15px; text-decoration: none; transition: all 0.3s ease; cursor: pointer; border: none; }
        
        .btn-tab { background: var(--glass-bg); color: var(--text-main); border: 1px solid var(--glass-border); }
        .btn-tab:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--c-cyan); transform: translateY(-2px); }
        .btn-tab.active { background: var(--gradient-main); color: #fff; border-color: transparent; box-shadow: 0 8px 20px rgba(0, 119, 255, 0.3); transform: none; }
        
        .btn-download { background: var(--glass-bg); color: var(--text-main); border: 1px solid var(--glass-border); }
        .btn-download:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--c-cyan); transform: translateY(-2px); }

        /* 3. قسم القنوات */
        .channels-section { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 25px; backdrop-filter: blur(10px); }
        .section-title { font-size: 18px; font-weight: 800; color: var(--c-cyan); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px; }
        .channels-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .channel-card { background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border); padding: 12px 16px; border-radius: 14px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: all 0.3s ease; }
        .channel-icon { width: 50px; height: 35px; border-radius: 6px; background: rgba(255,255,255,0.03); display: flex; justify-content: center; align-items: center; padding: 4px; transition: 0.3s; }
        .channel-icon img { width: 100%; height: 100%; object-fit: contain; opacity: 0.6; transition: 0.3s; }
        .channel-card h4 { font-size: 15px; font-weight: 700; color: var(--text-muted); transition: 0.3s; }
        .channel-card:hover, .channel-card.active { background: rgba(255, 255, 255, 0.08); border-color: var(--c-blue); transform: translateY(-3px); }
        .channel-card.active .channel-icon { background: rgba(255,255,255,0.1); box-shadow: inset 0 0 10px rgba(0, 119, 255, 0.2); }
        .channel-card:hover .channel-icon img, .channel-card.active .channel-icon img { opacity: 1; filter: drop-shadow(0px 0px 3px rgba(255, 255, 255, 0.5)); }
        .channel-card.active h4 { color: var(--text-main); }
        
        /* 4. تصميم الأخبار */
        .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .news-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 15px; overflow: hidden; cursor: pointer; transition: all 0.3s ease; display: flex; flex-direction: column; }
        .news-card:hover { transform: translateY(-5px); border-color: var(--c-blue); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .news-image { width: 100%; height: 180px; object-fit: cover; }
        .news-content { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .news-category { font-size: 13px; color: var(--c-cyan); font-weight: 800; margin-bottom: 8px; }
        .news-title { font-size: 17px; font-weight: 800; margin-bottom: 10px; color: var(--text-main); line-height: 1.4; }
        .news-summary { font-size: 14px; color: var(--text-muted); line-height: 1.6; }
        .news-footer { margin-top: auto; padding-top: 15px; font-size: 12px; color: var(--text-muted); display: flex; justify-content: space-between; border-top: 1px solid var(--glass-border); }

        /* صفحة الخبر المنفصلة */
        .article-container { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 30px; }
        .btn-back { display: inline-flex; align-items: center; gap: 10px; padding: 10px 20px; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-radius: 10px; color: white; cursor: pointer; margin-bottom: 20px; font-family: 'Cairo', sans-serif; font-weight: bold; transition: 0.3s;}
        .btn-back:hover { background: rgba(255,255,255,0.1); border-color: var(--c-cyan); }
        .article-image { width: 100%; max-height: 450px; object-fit: cover; border-radius: 15px; margin-bottom: 25px; border: 1px solid var(--glass-border); }
        .article-title { font-size: 28px; font-weight: 900; color: var(--c-cyan); margin-bottom: 15px; line-height: 1.4; }
        .article-meta { display: flex; flex-wrap: wrap; gap: 15px; color: var(--text-muted); font-size: 14px; margin-bottom: 25px; border-bottom: 1px solid var(--glass-border); padding-bottom: 15px; }
        .article-meta span { display: flex; align-items: center; gap: 6px; }
        .article-body { font-size: 17px; line-height: 1.9; color: var(--text-main); margin-bottom: 25px; }
        .match-details { background: rgba(0,0,0,0.4); padding: 20px; border-radius: 12px; border-right: 4px solid var(--c-blue); margin-top: 25px; display: flex; flex-direction: column; gap: 10px; }
        .tags-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
        .tag-badge { background: rgba(0, 119, 255, 0.2); border: 1px solid var(--c-blue); padding: 4px 10px; border-radius: 6px; font-size: 13px; color: #fff; }

        footer { text-align: center; padding: 30px; border-top: 1px solid var(--glass-border); margin-top: 40px; }

        @media (max-width: 768px) {
            .main-container { padding: 15px 10px; gap: 20px; }
            .channels-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
            .action-buttons { flex-direction: row; flex-wrap: wrap; gap: 10px; }
            .btn-action { font-size: 13px; padding: 10px 5px; flex-basis: 48%; }
            .btn-download { flex-basis: 100%; }
            .article-title { font-size: 22px; }
        }
    </style>
</head>

    <!-- مكتبة مشغل Clappr -->
    <script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>

    <script>
        let player; 
        let newsData = []; 

        window.onload = () => {
            fetchNewsData(); 
        };

        function handleRouting() {
            const urlParams = new URLSearchParams(window.location.search);
            const articleId = urlParams.get('id');

            if (articleId) {
                openArticleView(articleId);
            } else if (window.location.hash === '#news') {
                showMode('news');
            } else {
                showMode('live');
                const firstChannel = document.querySelector('.channel-card');
                if(firstChannel && !player) firstChannel.click(); 
            }
        }

        window.addEventListener('popstate', handleRouting);

        function switchTab(tabName) {
            const baseUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
            
            if (tabName === 'live') {
                window.history.pushState({}, '', baseUrl);
                showMode('live');
                if (player) player.play(); 
            } else if (tabName === 'news') {
                window.history.pushState({}, '', baseUrl + '#news');
                showMode('news');
                if (player) player.pause(); 
            }
        }

        function showMode(mode) {
            // إخفاء جميع الأقسام الديناميكية أولاً
            document.getElementById('view-player').classList.remove('active');
            document.getElementById('view-channels').classList.remove('active');
            document.getElementById('view-news-list').classList.remove('active');
            document.getElementById('view-article').classList.remove('active');
            
            // إزالة التفعيل من جميع الأزرار
            document.querySelectorAll('.btn-tab').forEach(el => el.classList.remove('active'));

            if (mode === 'live') {
                document.getElementById('view-player').classList.add('active');
                document.getElementById('view-channels').classList.add('active');
                document.getElementById('tab-live').classList.add('active');
            } else if (mode === 'news') {
                document.getElementById('view-news-list').classList.add('active');
                document.getElementById('tab-news').classList.add('active');
            } else if (mode === 'article') {
                document.getElementById('view-article').classList.add('active');
                document.getElementById('tab-news').classList.add('active');
            }
        }

        // ----------------- قسم البث المباشر -----------------
        async function switchChannel(apiUrl, title, element) {
            const wrapper = document.getElementById('video-container');
            const titleElement = document.getElementById('current-channel-text');
            wrapper.style.opacity = '0.5';
            
            document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
            if(element) element.classList.add('active');
            titleElement.innerText = title + ' (جاري التحميل...)';

            try {
                const response = await fetch(apiUrl);
                const jsonData = await response.json();
                
                if (jsonData && jsonData.data && jsonData.data.length > 0 && jsonData.data[0].url) {
                    const originalStreamUrl = jsonData.data[0].url;
                    const workerDomain = "https://website.fancy-water-8bf9.workers.dev/";
                    const proxiedStreamUrl = workerDomain + "?stream=" + encodeURIComponent(originalStreamUrl);
                    titleElement.innerText = title;
                    
                    if (player) player.destroy();

                    player = new Clappr.Player({
                        source: proxiedStreamUrl,
                        mimeType: 'application/x-mpegURL',
                        parentId: "#player",
                        width: '100%', height: '100%',
                        autoPlay: true,
                        poster: 'https://images.unsplash.com/photo-1522778119026-d647f0596c20?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80',
                        playback: {
                            playInline: true,
                            hlsjsConfig: {
                                maxMaxBufferLength: 20, fragLoadingTimeOut: 45000,      
                                manifestLoadingTimeOut: 45000, fragLoadingMaxRetry: 12,        
                                manifestLoadingMaxRetry: 12, levelLoadingMaxRetry: 12,
                                capLevelToPlayerSize: true      
                            }
                        }
                    });
                } else {
                    titleElement.innerText = title + ' (البث غير متوفر حالياً)';
                }
            } catch (error) {
                titleElement.innerText = title + ' (فشل الاتصال)';
            } finally {
                wrapper.style.opacity = '1';
            }
        }

        // ----------------- قسم الأخبار -----------------
        async function fetchNewsData() {
            try {
                const response = await fetch('https://pronewsagency.github.io/world/news.json');
                const data = await response.json();
                newsData = data.articles;
                renderNewsGrid();
                handleRouting(); 
            } catch (error) {
                console.error("خطأ في جلب الأخبار:", error);
                document.getElementById('news-container').innerHTML = '<div style="text-align: center; color: #ff2a2a; grid-column: 1 / -1;">حدث خطأ أثناء تحميل الأخبار.</div>';
            }
        }

        function renderNewsGrid() {
            const container = document.getElementById('news-container');
            container.innerHTML = newsData.map(news => {
                const dateStr = new Date(news.published_at).toLocaleDateString('ar-EG');
                return `
                <div class="news-card" onclick="openArticle('${news.id}')">
                    <img src="${news.image_url}" class="news-image" onerror="this.src='https://via.placeholder.com/400x200/141623/00FFD1?text=صورة+الخبر'">
                    <div class="news-content">
                        <div class="news-category">${news.sport_type}</div>
                        <h3 class="news-title">${news.title}</h3>
                        <p class="news-summary">${news.summary.substring(0, 80)}...</p>
                        <div class="news-footer">
                            <span><i class="fa-solid fa-pen"></i> ${news.author}</span>
                            <span><i class="fa-solid fa-clock"></i> ${dateStr}</span>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        function openArticle(id) {
            const baseUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
            window.history.pushState({id: id}, '', baseUrl + '?id=' + id);
            openArticleView(id);
        }

        // دالة مخصصة لتهيئة وحقن الإعلانات بعد تحميل صفحة الخبر الديناميكية
        function injectArticleAds() {
            // الإعلان الأول (تم تغيير البنية لإنشاء السكربت الخارجي مباشرةً لتجنب مشاكل التقييد)
            const ad1 = document.getElementById('article-ad-1');
            if (ad1) {
                const script1 = document.createElement('script');
                script1.settings = {}; // إعدادات فارغة كما هو مطلوب في السكربت الأصلي
                script1.src = "//conventionalresponse.com/bSXsVZs.dCGxl/0HYuWPcr/be/mS9GuCZkUPljkNP/Tcc/zVOMTsAlzxO/T/cVtmN-zGM/5GMOD/Q/wBMGQZ";
                script1.async = true; 
                script1.referrerPolicy = 'no-referrer-when-downgrade';
                ad1.appendChild(script1);
            }

            // الإعلان الثاني
            const ad2 = document.getElementById('article-ad-2');
            if (ad2) {
                const script2a = document.createElement('script');
                script2a.type = 'text/javascript';
                script2a.text = `atOptions = { 'key' : '4c36e881cfe896ed1e3d7ae247fec6a1', 'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {} };`;
                ad2.appendChild(script2a);

                const script2b = document.createElement('script');
                script2b.type = 'text/javascript';
                script2b.src = "https://www.highrevenueformat.com/4c36e881cfe896ed1e3d7ae247fec6a1/invoke.js";
                ad2.appendChild(script2b);
            }
        }

        function openArticleView(id) {
            const article = newsData.find(a => a.id === id);
            
            if (!article) {
                if(newsData.length === 0) return; 
                switchTab('news');
                return;
            }

            if (player) player.pause(); 

            let matchHtml = '';
            if (article.match_details && article.match_details.is_match_report) {
                matchHtml = `
                    <div class="match-details">
                        <h3 style="color: var(--c-cyan); margin-bottom: 5px; font-size: 18px;">
                            <i class="fa-solid fa-futbol"></i> تفاصيل المباراة
                        </h3>
                        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: bold; margin-top: 10px;">
                            <span>${article.match_details.team_home}</span>
                            <span style="background: var(--gradient-main); padding: 5px 15px; border-radius: 8px; color: #fff;">${article.match_details.score}</span>
                            <span>${article.match_details.team_away}</span>
                        </div>
                        <div style="text-align: center; color: var(--text-muted); font-size: 14px; margin-top: 5px;">الحالة: ${article.match_details.status}</div>
                    </div>
                `;
            }

            const tagsHtml = article.tags ? article.tags.map(tag => `<span class="tag-badge">#${tag}</span>`).join('') : '';
            const dateStr = new Date(article.published_at).toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

            // تم استبدال سكريبتات الإعلان بحاويات (Divs) لكي يتم حقن الكود بها برمجياً
            document.getElementById('view-article').innerHTML = `
                <button class="btn-back" onclick="switchTab('news')">
                    <i class="fa-solid fa-arrow-right"></i> عودة للأخبار
                </button>
                <div class="article-container">
                    <h1 class="article-title">${article.title}</h1>
                    <div class="article-meta">
                        <span><i class="fa-solid fa-pen-nib"></i> ${article.author}</span>
                        <span><i class="fa-solid fa-calendar-days"></i> ${dateStr}</span>
                        <span><i class="fa-solid fa-layer-group"></i> ${article.sport_type}</span>
                    </div>

                    <!-- حاوية الإعلان الأول -->
                    <div class="ad-banner-container" id="article-ad-1" style="margin-bottom: 15px;"></div>

                    <img src="${article.image_url}" class="article-image" onerror="this.src='https://via.placeholder.com/800x400/141623/00FFD1?text=لا+توجد+صورة'" style="margin-bottom: 15px;">
                    
                    <!-- حاوية الإعلان الثاني -->
                    <div class="ad-banner-container" id="article-ad-2" style="margin-bottom: 25px;"></div>

                    <div class="article-body">
                        ${article.summary}
                    </div>
                    ${matchHtml}
                    ${tagsHtml ? `<div class="tags-container">${tagsHtml}</div>` : ''}
                </div>
            `;

            // تنفيذ الدالة الخاصة بتفعيل وحقن الإعلانات
            injectArticleAds();

            showMode('article');
        }
    </script>
</body>
</html>
