<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON API Proxy</title>
</head>
<body style="margin: 0; background-color: #0e0e0e; color: #a6e22e;">
    <script>
        async function fetchAndDisplayChannel() {
            // 1. قراءة الـ ID من الرابط (مثال: ?id=5) - القناة 4 هي الافتراضية
            const urlParams = new URLSearchParams(window.location.search);
            const channelId = urlParams.get('id') || 4;

            const apiUrl = `https://cold-breeze-9b95.learnwithgedo.workers.dev/api/channel/${channelId}`;

            try {
                // 2. جلب البيانات من الخادم
                const response = await fetch(apiUrl);
                const jsonData = await response.json();

                if (jsonData.data && jsonData.data.length > 0) {
                    // إصلاح مشكلة رموز الرابط
                    const streamUrl = jsonData.data[0].url.replace(/\\u0026/g, '&');
                    
                    let channelName = "channel_" + channelId;
                    let expiresAt = Math.floor(Date.now() / 1000) + 600;
                    
                    // محاولة استخراج الاسم ووقت الانتهاء من الرابط إن وجد
                    try {
                        const urlObj = new URL(streamUrl);
                        const params = new URLSearchParams(urlObj.search);
                        if (params.has('expires')) {
                            expiresAt = parseInt(params.get('expires'));
                        }
                        
                        const pathParts = urlObj.pathname.split('/');
                        const filename = pathParts[pathParts.length - 1];
                        if (filename.includes('.m3u8')) {
                            channelName = filename.replace('.m3u8', '');
                        }
                    } catch (e) { }

                    // 3. بناء هيكل JSON المطلوب
                    const resultJson = {
                        ok: true,
                        channel: channelName,
                        expires_in_seconds: 600,
                        expires_at: expiresAt,
                        stream_url: streamUrl
                    };

                    // 4. طباعة النتيجة النهائية في الصفحة
                    printJson(resultJson);
                } else {
                    printJson({ ok: false, error: "لا توجد بيانات متاحة لهذه القناة" });
                }
            } catch (error) {
                printJson({ ok: false, error: "فشل الاتصال بخادم الاستخراج" });
            }
        }

        // دالة لمسح محتوى الصفحة وطباعة الـ JSON فقط كملف نصي
        function printJson(data) {
            document.body.innerHTML = "";
            const pre = document.createElement('pre');
            pre.style.wordWrap = "break-word";
            pre.style.whiteSpace = "pre-wrap";
            pre.style.margin = "10px";
            pre.style.fontFamily = "monospace";
            pre.style.fontSize = "15px";
            pre.textContent = JSON.stringify(data, null, 4);
            document.body.appendChild(pre);
        }

        // تشغيل العملية فور فتح الصفحة
        fetchAndDisplayChannel();
    </script>
</body>
</html>
